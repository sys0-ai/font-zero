<div class="demo">
 <header><a href="./">Fontzero</a><h1>Four corners</h1><label>Font set<select id="font-set" aria-label="Compatible font set"></select></label><label>Size<input id="demo-size" type="range" min="24" max="96" step="1" value="52"><output id="demo-size-value">52</output></label><button id="edit-text" aria-expanded="false" aria-controls="text-editor">Edit text</button></header>
 <section id="text-editor" hidden><label for="demo-text">Text</label><textarea id="demo-text" rows="6" maxlength="12000" spellcheck="false"></textarea></section>
 <div class="corners top"><label>Top left · 100%<select id="corner-0"></select></label><span id="demo-status" role="status" aria-live="polite">Loading fonts…</span><label>Top right · 100%<select id="corner-1"></select></label></div>
 <div id="poem-viewport" tabindex="0" role="region" aria-label="Scrollable poem with four-corner font blending"><div id="poem-canvas"></div></div>
 <div class="corners bottom"><label>Bottom left · 100%<select id="corner-2"></select></label><span>Boots · Rudyard Kipling</span><label>Bottom right · 100%<select id="corner-3"></select></label></div>
</div>
