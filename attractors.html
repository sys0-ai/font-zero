<div class="attractor-demo">
 <header><a href="./">Fontzero</a><h1>Font attractors</h1><label>Size <input id="demo-size" type="range" min="1" max="4096" step=".1" value="32"><input id="size-value" aria-label="Font size in pixels" type="number" min="1" max="4096" step=".1" value="32"><button id="fit-text" type="button" disabled>Fit</button></label><label>Line height <input id="line-height" type="range" min="1" max="3" step=".05" value="1.65"><output id="line-value">1.65</output></label><label>Padding <input id="padding" type="range" min="0" max="120" step="1" value="24"><output id="padding-value">24</output> px</label><button id="wrap-text" aria-pressed="false">Wrap text</button><button id="sampling" aria-pressed="false">Whole letter</button><button id="theme-toggle" aria-pressed="false">Light mode</button><button id="edit-text" aria-expanded="false" aria-controls="text-editor">Edit text</button></header>
 <div class="workspace">
  <aside class="attractor-panel"><div class="panel-title"><h2>Attractors</h2><button id="add-attractor">+ Add</button></div><div id="attractor-list"></div><div class="panel-actions"><button id="show-poles" aria-pressed="true">Hide attractors</button><button id="motion" aria-pressed="false">Pause motion</button></div><p id="status" role="status">Loading fonts…</p></aside>
  <div class="card-host"><div class="card-stage"><div class="text-card" id="viewport" tabindex="0" role="region" aria-label="Text blended by font attractors"><div id="text-canvas"></div></div><div class="card-rim" aria-hidden="true"></div></div></div>
  <aside class="inspector"><section id="text-editor" hidden><label class="stack" for="demo-text">Text</label><textarea id="demo-text" rows="8" maxlength="12000" spellcheck="false"></textarea></section><h2 id="selected-name">Attractor</h2><label class="stack">Font<select id="attractor-font"></select></label><label class="stack">Motion<select id="attractor-mode"><option value="placed">Placed on page</option><option value="cursor">Follow cursor</option><option value="bounce">Bouncing ball</option><option value="ambient">Everywhere</option></select></label><div id="spatial-controls"><label class="stack">Radius <span class="radius-entry"><input id="radius-value" aria-label="Radius in pixels" type="number" min=".5" max="1000" step=".5" value="180"> px</span><input id="radius" type="range" min=".5" max="1000" step=".5" value="180"></label><label class="stack">Decay <output id="decay-value"></output><input id="decay" type="range" min="0" max="6" step=".1" value="2"></label><label class="stack" id="speed-control">Speed <output id="speed-value"></output><input id="speed" type="range" min="10" max="300" value="90"></label><button id="place-attractor">Place on page</button></div><button id="remove-attractor">Remove attractor</button></aside>
 </div>
</div><div id="pole-layer"></div>
