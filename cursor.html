<div class="cursor-demo">
 <header><a href="./">Fontzero</a><h1>Cursor blend</h1><a href="demos/four-corners/">Four corners</a></header>
 <div class="controls">
  <label>Base font<select id="base-font"></select></label>
  <label>Cursor font<select id="cursor-font"></select></label>
  <label>Radius <output id="radius-value">180 px</output><input id="radius" type="range" min="40" max="600" step="1" value="180"></label>
  <label>Decay <output id="decay-value">1.5</output><input id="decay" type="range" min="0.25" max="5" step="0.05" value="1.5"></label>
 </div>
 <div id="cursor-viewport" tabindex="0" role="region" aria-label="Poem with cursor font blending"><svg id="cursor-poem" role="img" aria-label="What lips my lips have kissed, and where, and why by Edna St. Vincent Millay"></svg></div>
 <footer><span>What lips my lips have kissed, and where, and why · Edna St. Vincent Millay</span><span id="cursor-status" role="status">Loading fonts…</span></footer>
</div>
