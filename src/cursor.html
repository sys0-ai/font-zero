<div class="cursor-demo">
 <header><a href="./">Font Zero</a><h1>Cursor blend</h1><a href="demos/four-corners/">Four corners</a><button id="edit-text" aria-expanded="false" aria-controls="text-editor">Edit text</button></header>
 <section id="text-editor" hidden><label for="demo-text">Text</label><textarea id="demo-text" rows="4" maxlength="12000" spellcheck="false"></textarea></section>
 <div class="controls">
  <label>Size <output id="demo-size-value">36</output><input id="demo-size" type="range" min="16" max="96" step="1" value="36"></label>
  <label>Base font<select id="base-font"></select></label>
  <label>Cursor font<select id="cursor-font"></select></label>
  <label>Radius <output id="radius-value">180 px</output><input id="radius" type="range" min="40" max="600" step="1" value="180"></label>
  <label>Decay <output id="decay-value">1.5</output><input id="decay" type="range" min="0.25" max="5" step="0.05" value="1.5"></label>
 <button id="blend-sampling" aria-pressed="false">Whole letter</button>
 </div>
 <div class="card-stage"><div class="text-card" id="cursor-viewport" tabindex="0" role="region" aria-label="Poem with cursor font blending"><svg id="cursor-poem" role="img" aria-label="What lips my lips have kissed, and where, and why by Edna St. Vincent Millay"></svg></div></div>
 <footer><span>What lips my lips have kissed, and where, and why · Edna St. Vincent Millay</span><span id="cursor-status" role="status">Loading fonts…</span></footer>
</div>
